name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            ndk;28.2.13676358
            cmake;3.22.1

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :tgui:assembleRelease :demo:assembleDebug --stacktrace

      # The demo uses project(":tgui") and never sees the published AAR; this standalone
      # sample consumes it from mavenLocal only, so AAR-only breakage (e.g. D8 failures) shows up here.
      - name: Build host-app sample against the published AAR
        run: |
          ./gradlew :tgui:publishToMavenLocal --stacktrace
          cd samples/host-app
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tgui-release-aar
          path: tgui/build/outputs/aar/tgui-release.aar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: demo-debug-apk
          path: demo/build/outputs/apk/debug/*.apk
          if-no-files-found: error
